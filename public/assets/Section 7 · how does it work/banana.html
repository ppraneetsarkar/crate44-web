// --- UV Coordinate Preservation ---
function ensureUVs(geometry) {
  if (!geometry || !geometry.attributes) return;
  const uv = geometry.attributes.uv;
  if (uv && uv.count && uv.count > 0) return;
  
  const pos = geometry.attributes.position;
  if (!pos || !pos.count) return;
  const count = pos.count;
  const uvs = new Float32Array(count * 2);
  
  geometry.computeBoundingBox();
  const bb = geometry.boundingBox || new THREE.Box3();
  const size = new THREE.Vector3();
  bb.getSize(size);
  const min = bb.min;
  
  const sx = size.x || 1;
  const sy = size.y || 1;
  
  for (let i = 0; i < count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    uvs[i * 2] = (x - min.x) / sx;
    uvs[i * 2 + 1] = (y - min.y) / sy;
  }
  geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
}

// --- Asynchronous Preloading Texture Engine with In-Flight Deduplication ---
function loadTextureAsync(url, isColor = false, flipY = false) {
  if (!url) return Promise.resolve(null);
  const cacheKey = `${url}__${isColor ? 'srgb' : 'linear'}__${flipY ? 'flip' : 'noflip'}`;
  
  if (textureCache.has(cacheKey)) {
    return Promise.resolve(textureCache.get(cacheKey));
  }
  if (texturePromises.has(cacheKey)) {
    return texturePromises.get(cacheKey);
  }

  const p = new Promise((resolve) => {
    textureLoader.load(
      url,
      (tex) => {
        tex.mapping = THREE.UVMapping;
        tex.colorSpace = isColor ? THREE.SRGBColorSpace : THREE.NoColorSpace;
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(1, 1);
        tex.offset.set(0, 0);
        tex.center.set(0, 0);
        tex.rotation = 0;
        tex.flipY = flipY;
        tex.needsUpdate = true;
        textureCache.set(cacheKey, tex);
        resolve(tex);
      },
      undefined,
      (err) => {
        console.warn('Texture load fallback:', url, err);
        resolve(null);
      }
    );
  });

  texturePromises.set(cacheKey, p);
  return p;
}

// --- Fast HDRI Loading with In-Memory Caching ---
function loadEnvMapAsync(name) {
  const url = envMaps[name];
  if (!url) return Promise.resolve(null);
  
  if (envCache.has(url)) {
    const envMap = envCache.get(url);
    scene.environment = envMap;
    updateBackground();
    return Promise.resolve(envMap);
  }
  if (envPromises.has(url)) {
    return envPromises.get(url);
  }

  const p = new Promise((resolve) => {
    rgbeLoader.load(
      url,
      (texture) => {
        const envMap = pmremGenerator.fromEquirectangular(texture).texture;
        envCache.set(url, envMap);
        scene.environment = envMap;
        updateBackground();
        texture.dispose();
        resolve(envMap);
      },
      undefined,
      (err) => {
        console.warn('HDRI load issue:', err);
        resolve(null);
      }
    );
  });

  envPromises.set(url, p);
  return p;
}

// --- Background Logic ---
function updateBackground() {
  const mode = controls.get('bg_mode');
  const customUrl = controls.get('custom_bg');

  if (mode === 'Transparent') {
    scene.background = null;
  } else if (mode === 'Solid Color') {

}

// --- Asynchronous High-Speed Model Asset Loader ---
async function fetchAndParseModel(url) {
  if (!url) return null;
  if (modelCache.has(url)) {
    const cached = modelCache.get(url);
    return { object: cached.object.clone(true), isGLTF: cached.isGLTF };
  }

  const lowerUrl = url.toLowerCase();
  const isGLBHint = lowerUrl.includes('.glb') || lowerUrl.includes('.gltf');
  const isOBJHint = lowerUrl.includes('.obj');

  return new Promise((resolve) => {
    if (isGLBHint) {
      gltfLoader.load(
        url,
        (gltf) => {
          if (gltf && gltf.scene) {
            modelCache.set(url, { object: gltf.scene.clone(true), isGLTF: true });
            resolve({ object: gltf.scene, isGLTF: true });
          } else {
            fallbackParseBuffer(url).then(resolve);
          }
        },
        undefined,
        () => {
          fallbackParseBuffer(url).then(resolve);
        }
      );
    } else if (isOBJHint) {
      objLoader.load(
        url,
        (obj) => {
          if (obj) {
            modelCache.set(url, { object: obj.clone(true), isGLTF: false });
            resolve({ object: obj, isGLTF: false });
          } else {
            fallbackParseBuffer(url).then(resolve);
          }
        },
        undefined,
        () => {
          fallbackParseBuffer(url).then(resolve);
        }
      );
    } else {
      fallbackParseBuffer(url).then(resolve);
    }
  });
}

async function fallbackParseBuffer(url) {
  try {
    const res = await fetch(url);
    const buffer = await res.arrayBuffer();
    const view = new DataView(buffer);
    const isGLB = buffer.byteLength >= 4 && view.getUint32(0, true) === 0x46546C67;

    return new Promise((resolve) => {
      if (isGLB) {
        gltfLoader.parse(
          buffer,
          '',
          (gltf) => {
            if (gltf && gltf.scene) {
              modelCache.set(url, { object: gltf.scene.clone(true), isGLTF: true });
              resolve({ object: gltf.scene, isGLTF: true });
            } else {
              resolve(null);
            }
          },
          () => resolve(null)
        );
      } else {
        const text = new TextDecoder().decode(buffer);
        if (text.includes('"asset"') && text.includes('"version"')) {
          gltfLoader.parse(
            buffer,
            '',
            (gltf) => {
              if (gltf && gltf.scene) {
                modelCache.set(url, { object: gltf.scene.clone(true), isGLTF: true });
                resolve({ object: gltf.scene, isGLTF: true });
              } else {
                resolve(null);
              }
            },
            () => resolve(null)
          );
        } else {
          try {
            const object = objLoader.parse(text);
            if (object) {
              modelCache.set(url, { object: object.clone(true), isGLTF: false });
              resolve({ object, isGLTF: false });
            } else {
              resolve(null);
            }
          } catch (e) {
            resolve(null);
          }
        }
      }
    });
  } catch (err) {
    console.error('Fallback parse error:', err);
    return null;
  }
}

// --- Assemble Geometry and Setup Model Group ---
function buildModelGroup(object, isGLTF = false) {
  if (!object) return null;
  
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const scale = 2.2 / maxDim;
  
  const group = new THREE.Group();
  object.scale.setScalar(scale);
  object.position.sub(center.multiplyScalar(scale));
  group.add(object);
  
  object.traverse((child) => {
    if (child && child.isMesh) {
      if (child.geometry) {
        ensureUVs(child.geometry);
      }
      child.material = material;
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });
  
  group.userData.baseScale = 1;
  return group;
}

// --- Parallel Full Material Map Resolver ---
async function fetchAllActiveMaps(isGLTF) {
  const flipY = !isGLTF;

  const mapJobs = [
    controls.get('mat_texture_mode') === 'Upload' && controls.get('mat_texture')
      ? loadTextureAsync(controls.get('mat_texture'), true, flipY)
      : Promise.resolve(null),
    controls.get('mat_normal_mode') === 'Upload' && controls.get('mat_normal')
      ? loadTextureAsync(controls.get('mat_normal'), false, flipY)
      : Promise.resolve(null),
    controls.get('mat_displacement_mode') === 'Upload' && controls.get('mat_displacement')
      ? loadTextureAsync(controls.get('mat_displacement'), false, flipY)
      : Promise.resolve(null),
    controls.get('mat_roughness_mode') === 'Upload' && controls.get('mat_roughness')
      ? loadTextureAsync(controls.get('mat_roughness'), false, flipY)
      : Promise.resolve(null),
    controls.get('mat_metalness_mode') === 'Upload' && controls.get('mat_metalness')
      ? loadTextureAsync(controls.get('mat_metalness'), false, flipY)
      : Promise.resolve(null),
    controls.get('mat_ao_mode') === 'Upload' && controls.get('mat_ao')
      ? loadTextureAsync(controls.get('mat_ao'), false, flipY)
      : Promise.resolve(null),
    controls.get('mat_emissive_mode') === 'Upload' && controls.get('mat_emissive')
      ? loadTextureAsync(controls.get('mat_emissive'), true, flipY)
      : Promise.resolve(null),
  ];

  const [mapTex, normTex, dispTex, roughTex, metalTex, aoTex, emissTex] = await Promise.all(mapJobs);

  material.map = mapTex;
  material.normalMap = normTex;
  material.displacementMap = dispTex;
  material.roughnessMap = roughTex;
  material.metalnessMap = metalTex;
  material.aoMap = aoTex;
  material.emissiveMap = emissTex;
  material.needsUpdate = true;
}

// --- Individual Map Update without Pop-in ---
async function updateSingleMap(matProp, modeKey, imgKey, isColor = false) {
  const mode = controls.get(modeKey);
  const url = controls.get(imgKey);

  if (mode === 'None' || !url) {
    if (material[matProp] !== null) {
      material[matProp] = null;
      material.needsUpdate = true;
    }
    return;
  }

  const flipY = !isLoadedGLTF;
  const tex = await loadTextureAsync(url, isColor, flipY);
  
  if (controls.get(modeKey) === 'Upload' && controls.get(imgKey) === url) {
    material[matProp] = tex;
    material.needsUpdate = true;
    renderer.compile(scene, camera);
  }
}

// --- Atomic Model Swap Pipeline ---
async function handleFileUpload(url) {
  const loadId = ++activeModelLoadId;
  
  // Start texture downloads in parallel with the model download (guess orientation from URL)
  const guessGLTF = !/\.obj(\?|$)/i.test(url);
  const mapsPromise = fetchAllActiveMaps(guessGLTF);
  
  const modelData = await fetchAndParseModel(url);
  if (loadId !== activeModelLoadId) return;

  if (modelData && modelData.object) {
    isLoadedGLTF = modelData.isGLTF;
    const newGroup = buildModelGroup(modelData.object, isLoadedGLTF);
    
    // Show the model as soon as geometry is ready; maps apply when they land
    syncMaterialScalars();
    mapsPromise.then(() => {
      if (loadId !== activeModelLoadId) return;
      if (guessGLTF !== isLoadedGLTF) return fetchAllActiveMaps(isLoadedGLTF);
    });
    
    if (currentModel) {
      scene.remove(currentModel);
    }
    decals = [];
    currentModel = newGroup;
    scene.add(currentModel);

    // Warm-up WebGL shaders
    renderer.compile(scene, camera);
  }
}

}

// --- DOM Visibility Helper for Map Upload Inputs ---
const mapPairs = [
  { modeKey: 'mat_texture_mode', label: 'Base Color Map' },
  { modeKey: 'mat_normal_mode', label: 'Normal Map' },
  { modeKey: 'mat_displacement_mode', label: 'Displacement Map' },
  { modeKey: 'mat_roughness_mode', label: 'Roughness Map' },
  { modeKey: 'mat_metalness_mode', label: 'Metalness Map' },

  { modeKey: 'mat_emissive_mode', label: 'Emissive Map' }

function syncMapUIVisibility() {
  try {
    const sidebar = document.querySelector('.controls-sidebar') || document.body;
    mapPairs.forEach(({ modeKey, label }) => {
      const mode = controls.get(modeKey);
      const isUpload = (mode === 'Upload');
      
      const candidateElements = [];
      const walker = document.createTreeWalker(sidebar, NodeFilter.SHOW_TEXT, null, false);
      let node;
      while ((node = walker.nextNode())) {
        if (node.nodeValue && node.nodeValue.trim() === label) {
          if (node.parentElement) {
            candidateElements.push(node.parentElement);
          }
        }
      }

      candidateElements.forEach((labelEl) => {
        let curr = labelEl;
        let container = labelEl;
        for (let i = 0; i < 6; i++) {
          if (curr.parentElement && curr.parentElement !== document.body) {
            curr = curr.parentElement;
            const className = curr.className || '';
            if (typeof className === 'string' && (
              className.includes('control') ||
              className.includes('field') ||
              className.includes('item') ||
              curr.getAttribute('data-key')
            )) {
              container = curr;
              break;
            } else if (i >= 2) {
              container = curr;
            }
          }
        }
        if (container && container !== document.body) {
          container.style.display = isUpload ? '' : 'none';
        }
      });
    });
  } catch (err) {
    console.warn('Map UI sync error:', err);
  }
}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (controls.get('interaction_mode') !== 'Place Stickers') return;
  if (stickerTextures.length === 0 || !currentModel) return;

  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  currentModel.updateMatrixWorld(true);
  camera.updateMatrixWorld(true);

  raycaster.setFromCamera(mouse, camera);
  
  const intersects = raycaster.intersectObject(currentModel, true);

  if (intersects.length > 0) {
    const hit = intersects.find((i) => i.object.isMesh && !i.object.isDecal);
    if (hit) {
      placeSticker(hit.point, hit.face.normal, hit.object);
    }
  }
});

function placeSticker(position, normal, targetMesh) {
  if (stickerTextures.length === 0) return;
  
  const mode = controls.get('sticker_placement_mode');
  let tex;
  if (mode === 'Sequential') {
    tex = stickerTextures[sequentialIndex % stickerTextures.length];
    sequentialIndex++;
  } else if (mode === 'Specific') {
    const idx = Math.max(0, Math.min(controls.get('sticker_index') - 1, stickerTextures.length - 1));
    tex = stickerTextures[idx];
  } else {
    tex = stickerTextures[Math.floor(Math.random() * stickerTextures.length)];
  }

  if (!tex) return;

  const sizeVal = controls.get('sticker_size');
  const rotationVal = THREE.MathUtils.degToRad(controls.get('sticker_rotation'));
  
  const dummy = new THREE.Object3D();
  dummy.position.copy(position);
  
  const n = normal.clone();
  n.transformDirection(targetMesh.matrixWorld);
  
  dummy.lookAt(dummy.position.clone().add(n));
  dummy.rotateZ(rotationVal);

  const size = new THREE.Vector3(sizeVal, sizeVal, sizeVal);
  
  targetMesh.updateWorldMatrix(true, false);
  const decalGeom = new DecalGeometry(targetMesh, position, dummy.rotation, size);
  
  const inverseMatrix = new THREE.Matrix4().copy(targetMesh.matrixWorld).invert();
  decalGeom.applyMatrix4(inverseMatrix);
  
  const decalMat = new THREE.MeshStandardMaterial({
    map: tex,
    transparent: true,
    depthTest: true,
    depthWrite: false,
    polygonOffset: true,
    polygonOffsetFactor: -4,
    polygonOffsetUnits: -4,
    roughness: controls.get('roughness'),
    metalness: controls.get('metalness')
  });

  const decalMesh = new THREE.Mesh(decalGeom, decalMat);
  decalMesh.isDecal = true;
  
  targetMesh.add(decalMesh);
  decals.push(decalMesh);
}

  material.color.set(controls.get('mat_color'));
  material.roughness = controls.get('roughness');
  material.metalness = controls.get('metalness');
  material.envMapIntensity = controls.get('env_intensity');
  const nScale = controls.get('normal_scale') ?? 1;
  material.normalScale.set(nScale, nScale);
  material.displacementScale = controls.get('displacement_scale');
  material.aoMapIntensity = controls.get('ao_intensity');
  material.emissive.set(controls.get('emissive_color'));
  material.emissiveIntensity = controls.get('emissive_intensity');
  
  mainLight.color.set(controls.get('light_color'));
  mainLight.intensity = controls.get('light_intensity');
  ambientLight.color.set(controls.get('ambient_color'));
  
  renderer.toneMappingExposure = controls.get('env_exposure');
  scene.backgroundBlurriness = controls.get('bg_blur');
  
  const envRot = THREE.MathUtils.degToRad(controls.get('env_rotation'));
  scene.backgroundRotation.y = envRot;
  scene.environmentRotation.y = envRot;
  
  // Real-time Motion Styles
  if (currentModel) {
    if (isPlaying) {
      time += 0.01 * speed;
      
      if (motionStyle === 'Spin') {
        autoRotation += 0.01 * speed;
        currentModel.position.y = 0;
        currentModel.scale.setScalar(currentModel.userData.baseScale || 1);
      } else if (motionStyle === 'Swing') {
        autoRotation = Math.sin(time) * Math.PI * 0.25;
        currentModel.position.y = 0;
        currentModel.scale.setScalar(currentModel.userData.baseScale || 1);
      } else if (motionStyle === 'Float') {
        currentModel.position.y = Math.sin(time * 2) * 0.2;
        autoRotation += 0.005 * speed;
      } else if (motionStyle === 'Pulse') {
        const s = 1 + Math.sin(time * 4) * 0.05;
        const base = currentModel.userData.baseScale || 1;
        currentModel.scale.setScalar(s * base);
        autoRotation += 0.005 * speed;
      }
    }
    
    currentModel.rotation.x = THREE.MathUtils.degToRad(rot.x);
    currentModel.rotation.y = THREE.MathUtils.degToRad(rot.y) + autoRotation;
    currentModel.rotation.z = THREE.MathUtils.degToRad(rot.z);
  }
  
  // Orbital Camera
  const radius = zoom;
  camera.position.x = radius * Math.sin(yaw) * Math.cos(pitch);
  camera.position.y = radius * Math.sin(pitch);
  camera.position.z = radius * Math.cos(yaw) * Math.cos(pitch);
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  const w = area.clientWidth;
  const h = area.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

animate();

    
  </script>
</body>
</html>
